<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>smoke-198</title></head>
<body>
<pre id="out">running</pre>
<script>
const OPEN = '<' + 'script>';
const CLOSE = '<' + '/' + 'script>';
const COLLECTOR = OPEN + `
window.__errs = [];
window.onerror = function(m,s,l){ window.__errs.push('ONERROR: '+String(m)+' @'+String(s).split('/').pop()+':'+l); return false; };
window.addEventListener('unhandledrejection', function(e){ window.__errs.push('REJ: '+String((e.reason&&e.reason.message)||e.reason)); });
` + CLOSE;
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const log = [];
  const f = document.createElement('iframe');
  f.style.cssText = 'width:1500px;height:900px;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(COLLECTOR);
  const html = await (await fetch('/index.html')).text();
  d.write(html); d.close();
  await sleep(16000);

  const doc = f.contentDocument, w = f.contentWindow;
  log.push('mounted=' + !!doc.querySelector('[data-v-app]') + ' storedId=' + w.localStorage.getItem('roleplay_hub_update_id'));
  // 公告弹窗
  const modal = doc.querySelector('.update-content') || doc.querySelector('.markdown-body');
  log.push('公告弹窗存在=' + !!modal);
  const mtext = modal ? (modal.innerText || '') : '';
  log.push('公告含 1.9.8        : ' + mtext.includes('1.9.8'));
  log.push('公告含「随机生成工具」: ' + mtext.includes('随机生成工具'));
  log.push('公告含 交流群        : ' + /交流群/.test(mtext) + '  ← 应为 false');
  log.push('公告含 欢迎进群      : ' + /欢迎进群/.test(mtext) + '  ← 应为 false');
  log.push('公告含「更新时间」    : ' + mtext.includes('更新时间'));
  // 全页兜底检查
  log.push('全页 交流群          : ' + /交流群/.test(doc.body.innerText) + '  ← 应为 false');
  log.push('RPHubTheme=' + !!w.RPHubTheme + ' | 上游同步卡=' + /上游同步/.test(doc.body.innerText));
  // 导航
  const trg = Array.from(doc.querySelectorAll('.app-nav-trigger')).filter(e => e.getClientRects().length);
  log.push('可见 trigger=' + trg.length);
  if (trg.length) { trg[0].click(); await sleep(1800); }
  const p = doc.querySelector('#app-navigation-panel');
  log.push('面板弹出=' + !!p + ' 项目=' + (p ? Array.from(p.querySelectorAll('button')).map(b => (b.innerText||'').trim()).filter(x => x && x.length < 10).slice(0, 8).join('/') : '(无)'));
  log.push('errors=' + JSON.stringify((w.__errs || []).slice(0, 6)));
  document.getElementById('out').textContent = 'S8:' + JSON.stringify(log);
})();
</script>
</body>
</html>
